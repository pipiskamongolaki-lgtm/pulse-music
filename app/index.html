<script>
/* Страховка от пустого экрана: понятное сообщение вместо пустоты. */
(function () {
  var shown = false;
  function show(title, html, retry) {
    if (shown || window.__pulseBooted) return;
    shown = true;
    var box = document.createElement('div');
    box.id = 'boot-error';
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(9,9,13,.92);color:#f5f5f8;font:500 15px/1.5 Manrope,system-ui,sans-serif';
    box.innerHTML = '<div style="max-width:460px;background:#16161f;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)">' +
      '<img src="icons/icon.svg" alt="" style="width:52px;height:52px;border-radius:14px;margin-bottom:14px">' +
      '<h2 style="margin:0 0 10px;font:700 21px/1.25 Unbounded,Manrope,system-ui,sans-serif">' + title + '</h2>' +
      '<div style="color:rgba(245,245,248,.75)">' + html + '</div>' +
      (retry ? '<button onclick="location.reload()" style="margin-top:18px;height:42px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font:700 14px Manrope,system-ui,sans-serif;cursor:pointer">Попробовать снова</button>' : '') +
      '</div>';
    document.body.appendChild(box);
  }
  window.__pulseBootFail = function (msg) {
    show('Pulse не запустился', 'Обнови страницу. Если не поможет, закрой окно сервера и снова запусти <b>start-pulse.bat</b>.<br><small style="opacity:.6">' + String(msg).replace(/</g, '&lt;') + '</small>', true);
  };

  if (location.protocol === 'file:') {
    // Открыт файлом: браузер не запускает модули с диска. Если сервер уже работает, переходим на него.
    var ping = new Image();
    ping.onload = function () { location.replace('http://localhost:5173/' + location.hash); };
    ping.onerror = function () {
      show('Запусти Pulse через start-pulse.bat',
        'Ты открыл файл <b>index.html</b> напрямую, а так браузер не разрешает приложению работать.<br><br>' +
        'Открой папку <b>pulse-music</b> и дважды кликни <b>start-pulse.bat</b>: Pulse откроется сам по адресу <b>http://localhost:5173</b>.<br><br>' +
        'Если уже запустил, нажми кнопку ниже.', true);
    };
    ping.src = 'http://localhost:5173/icons/favicon-32.png?' + Date.now();
    return;
  }

  var lastError = '';
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') lastError = 'Не загрузился ' + (t.src || 'скрипт');
    else if (e.message) lastError = e.message;
  }, true);
  setTimeout(function () {
    if (!window.__pulseBooted) window.__pulseBootFail(lastError || 'Скрипты не ответили за 10 секунд');
  }, 10000);
})();
</script>
